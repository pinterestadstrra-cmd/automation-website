# Automation Website - Bluesky workflow (runs Bluesky cards ONLY)
# Separate from the Blogger workflow so each can be enabled/disabled
# on its own. Bluesky posting via atproto still works while the
# Blogger API is restricted - this is the workflow to keep enabled.
# Runs every 10 minutes (rebuild #7): a due posting slot is picked up
# within ~10 minutes, and a card also runs on its own interval for
# reply checks. Public repos get unlimited free Actions minutes, so
# the 10-minute cadence costs nothing.
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEYS       comma-separated Gemini API keys (separate Google projects)
#   GROQ_API_KEYS         comma-separated Groq API keys (separate Groq accounts)
#   BLUESKY_ACCOUNTS      JSON list: [{"handle":"...","app_password":"..."}]
#   REDDIT_ACCOUNTS       JSON list: [{"username":"...","password":"...",
#                         "client_id":"...","client_secret":"..."}]
#                         (or single-account secrets REDDIT_CLIENT_ID /
#                         REDDIT_CLIENT_SECRET / REDDIT_USERNAME /
#                         REDDIT_PASSWORD - the worker falls back to them)
#   BLOG_ID               Blogger blog id (for article links)
#   PEXELS_API_KEY        (optional) Pexels free key for photos
#   PIXABAY_API_KEY       (optional) Pixabay free key for photos
#   ADMIN_PASSWORD        dashboard password (also used by the web UI)
name: Automation Bluesky

# Rebuild #7.8: SERIALIZE runs. A run takes ~13 min but the cron
# fires every 10 min, so runs overlapped ROUTINELY - two concurrent
# runs read the same state.json, picked the same fresh story and
# posted it twice (the "same post twice" and "same post on two
# accounts" bugs). With cancel-in-progress: false, a new run WAITS
# for the current one to finish (and reads its updated state)
# instead of racing it. This is the cross-run race fix; the in-run
# guards (cooldown, gap, account record) are the in-run fix.
concurrency:
  group: automation-bluesky
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Rebuild #7.3: full history so the commit-back step can
        # rebase on top of a concurrent commit (a dashboard commit
        # made while this run was working would otherwise make the
        # push fail with "non-fast-forward" - and the old silent
        # push swallowed that failure, which is why data/state.json
        # went stale in the repo).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker (Bluesky cards only)
        run: python app.py --worker --only bluesky
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          BLUESKY_ACCOUNTS: ${{ secrets.BLUESKY_ACCOUNTS }}
          REDDIT_ACCOUNTS: ${{ secrets.REDDIT_ACCOUNTS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Commit state back (dedup + activity)
        # Rebuild #7.5: the push MUST land. The old rebase-based
        # commit-back NEVER persisted state (zero "automation state
        # update" commits in the repo history): a rebase conflicts on
        # data/state.json whenever the dashboard commits a flag
        # mid-run, the abort drops the push, and the step still exits
        # 0. Now: save the worker's files, reset to the remote,
        # MERGE the worker's state into the remote state (newest
        # timestamps win; dashboard flags set after the run started
        # are kept), commit, and push with retries. A push that
        # still fails prints a loud WARNING in the run log instead
        # of pretending everything was fine.
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@users.noreply.github.com"
          mkdir -p /tmp/worker-state
          cp data/state.json data/logs.json data/dashboard.json /tmp/worker-state/ 2>/dev/null || true
          cat > /tmp/merge_state.py <<'PYEOF'
          """Merge the worker's just-saved state into the remote state.
          Run AFTER `git checkout -B main origin/main` (so data/*.json
          are the remote versions) with the worker's files in
          /tmp/worker-state/. Uses app.merge_worker_state (tested)."""
          import json, os, shutil, sys
          sys.path.insert(0, ".")
          from app import merge_worker_state
          def load_dict(p):
              try:
                  with open(p, encoding="utf-8") as f:
                      d = json.load(f)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}
          def load_list(p):
              try:
                  with open(p, encoding="utf-8") as f:
                      d = json.load(f)
                  return d if isinstance(d, list) else []
              except Exception:
                  return []
          remote = load_dict("data/state.json")
          local = load_dict("/tmp/worker-state/state.json")
          merged = merge_worker_state(remote, local)
          with open("data/state.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)
          seen = {}
          for e in load_list("data/logs.json") + load_list("/tmp/worker-state/logs.json"):
              if isinstance(e, dict):
                  seen[(e.get("created_at"), e.get("level"), e.get("message"))] = e
          merged_logs = sorted(seen.values(),
                               key=lambda e: str(e.get("created_at") or ""),
                               reverse=True)[:200]
          with open("data/logs.json", "w", encoding="utf-8") as f:
              json.dump(merged_logs, f, ensure_ascii=False, indent=2)
          if os.path.exists("/tmp/worker-state/dashboard.json"):
              shutil.copyfile("/tmp/worker-state/dashboard.json",
                              "data/dashboard.json")
          print("state merged: "
                f"{len(merged.get('posted_promo_topics') or {})} topics, "
                f"{len(merged.get('posted_promo_link_topics') or {})} link-topics, "
                f"{len(merged_logs)} log entries")
          PYEOF
          pushed=""
          for i in 1 2 3; do
            git fetch origin main || true
            git checkout -B main origin/main || git checkout main || true
            python3 /tmp/merge_state.py
            git add data/state.json data/logs.json data/dashboard.json
            if git diff --cached --quiet; then
              echo "no state changes to commit - state already current"
              pushed="done"
              break
            fi
            git commit -m "automation state update (bluesky)" || true
            if git push origin main; then
              echo "state pushed (attempt $i)"
              pushed="done"
              break
            fi
            echo "push attempt $i failed - retrying"
            sleep 5
          done
          [ -n "$pushed" ] || echo "WARNING: state push failed - state/logs NOT persisted this run (check the next run)"
