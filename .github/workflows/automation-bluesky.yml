# Automation Website - Bluesky workflow (runs Bluesky cards ONLY)
# Separate from the Blogger workflow so each can be enabled/disabled
# on its own. Bluesky posting via atproto still works while the
# Blogger API is restricted - this is the workflow to keep enabled.
# Runs at :20 and :50 (every 30 min, offset from the Blogger workflow
# so the two never commit state.json at the same moment).
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEYS       comma-separated Gemini API keys (separate Google projects)
#   GROQ_API_KEYS         comma-separated Groq API keys (separate Groq accounts)
#   BLUESKY_ACCOUNTS      JSON list: [{"handle":"...","app_password":"..."}]
#   BLOG_ID               Blogger blog id (for article links)
#   PEXELS_API_KEY        (optional) Pexels free key for photos
#   PIXABAY_API_KEY       (optional) Pixabay free key for photos
#   ADMIN_PASSWORD        dashboard password (also used by the web UI)
name: Automation Bluesky

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker (Bluesky cards only)
        run: python app.py --worker --only bluesky
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          BLUESKY_ACCOUNTS: ${{ secrets.BLUESKY_ACCOUNTS }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Commit state back (dedup + activity)
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@users.noreply.github.com"
          git add data/state.json data/logs.json data/dashboard.json || true
          git diff --cached --quiet || git commit -m "automation state update (bluesky)"
          git push || true
