# Automation Website - Blogger workflow (runs Blogger cards ONLY)
# Separate from the Bluesky workflow so each can be enabled/disabled
# on its own. Blogger API is currently RESTRICTED by Google (appeal
# pending) - keep this workflow DISABLED until the appeal succeeds.
# Runs at :05 and :35 (every 30 min, offset from the Bluesky workflow
# so the two never commit state.json at the same moment).
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEYS       comma-separated Gemini API keys (separate Google projects)
#   GROQ_API_KEYS         comma-separated Groq API keys (separate Groq accounts)
#   BLOGGER_CLIENT_ID     Google OAuth client id (Blogger API enabled)
#   BLOGGER_CLIENT_SECRET Google OAuth client secret
#   BLOGGER_REFRESH_TOKEN Blogger OAuth refresh token (offline access)
#   BLOG_ID               Blogger blog id
#   PEXELS_API_KEY        (optional) Pexels free key for photos
#   PIXABAY_API_KEY       (optional) Pixabay free key for photos
#   ADMIN_PASSWORD        dashboard password (also used by the web UI)
name: Automation Blogger

# Rebuild #7.8: SERIALIZE runs (same fix as the Bluesky workflow -
# a run can take longer than the cron interval, and overlapping runs
# read the same state.json and race). cancel-in-progress: false
# makes a new run WAIT for the current one instead of racing it.
concurrency:
  group: automation-blogger
  cancel-in-progress: false

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker (Blogger cards only)
        run: python app.py --worker --only blogger
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Commit state back (dedup + activity)
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@users.noreply.github.com"
          git add data/state.json data/logs.json data/dashboard.json || true
          git diff --cached --quiet || git commit -m "automation state update (blogger)"
          git push || true
