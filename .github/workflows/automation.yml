# Automation Website - GitHub Actions runner
# Runs the worker every 30 minutes (and on manual dispatch).
# Public repos get unlimited free Actions minutes.
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEYS       comma-separated Gemini API keys (separate Google projects)
#   GROQ_API_KEYS         comma-separated Groq API keys (separate Groq accounts)
#   BLOGGER_CLIENT_ID     Google OAuth client id (Blogger API enabled)
#   BLOGGER_CLIENT_SECRET Google OAuth client secret
#   BLOGGER_REFRESH_TOKEN Blogger OAuth refresh token (offline access)
#   BLOG_ID               Blogger blog id
#   BLUESKY_ACCOUNTS      JSON list: [{"handle":"...","app_password":"..."}]
#   PEXELS_API_KEY        (optional) Pexels free key for photos
#   PIXABAY_API_KEY       (optional) Pixabay free key for photos
#   ADMIN_PASSWORD        dashboard password (also used by the web UI)
name: Automation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker (one cycle)
        run: python app.py --worker
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLUESKY_ACCOUNTS: ${{ secrets.BLUESKY_ACCOUNTS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Commit state back (dedup + activity)
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@users.noreply.github.com"
          git add data/state.json data/logs.json || true
          git diff --cached --quiet || git commit -m "automation state update"
          git push || true
